{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0"><i class="bi bi-box-arrow-in-right me-2"></i>Welcome Back</h4>
            </div>
            <div class="card-body p-4">
                <form id="loginForm" action="{{ url_for('login') }}" method="POST" novalidate>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                        </div>
                        <div class="invalid-feedback" id="emailError">Please enter a valid email address.</div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                        </div>
                        <div class="invalid-feedback" id="passwordError">Password is required.</div>
                    </div>
                    
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-info text-white btn-lg fw-bold">Login</button>
                    </div>
                    
                    <div class="text-center mt-3">
                        <p class="mb-0 text-muted">Don't have an account? <a href="{{ url_for('register') }}" class="text-decoration-none fw-bold text-info">Register here</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    $(document).ready(function() {
        $('#loginForm').on('submit', function(e) {
            let isValid = true;
            
            // Clear previous errors
            $('.form-control').removeClass('is-invalid');
            
            // Email Validation
            const email = $('#email').val().trim();
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (email === '') {
                $('#email').addClass('is-invalid');
                $('#emailError').text('Email is required.');
                isValid = false;
            } else if (!emailPattern.test(email)) {
                $('#email').addClass('is-invalid');
                $('#emailError').text('Please enter a valid email address.');
                isValid = false;
            } else {
                $('#email').removeClass('is-invalid').addClass('is-valid');
            }
            
            // Password Validation
            const password = $('#password').val();
            if (password === '') {
                $('#password').addClass('is-invalid');
                $('#passwordError').text('Password is required.');
                isValid = false;
            } else {
                $('#password').removeClass('is-invalid').addClass('is-valid');
            }

            // Prevent submission if invalid
            if (!isValid) {
                e.preventDefault();
                return false;
            }
            return true;
        });

        // Clear errors on input
        $('.form-control').on('input', function() {
            $(this).removeClass('is-invalid');
        });
    });
</script>
{% endblock %}
